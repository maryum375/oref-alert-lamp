; Build with pioarduino IDE extension (recommended) or: pio run -t upload
; Board: ESP32-C6 with 4MB flash
[platformio]
default_envs = esp32-c6-devkitc-1

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
board_build.partitions = partitions.csv
; ESP32-C6-DevKitC-1 talks over the built-in USB-Serial/JTAG;
; without these, Serial() goes to the unconnected UART0 pins.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit NeoPixel@^1.12.0
